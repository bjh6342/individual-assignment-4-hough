<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industry 4.0 Hub | Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
	<link href="https://fonts.cdnfonts.com/css/ranade" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Specific page modifications for form spacing */
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #1a252f;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #3498db;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="upgrade.html">Trad Climbing</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <header>
        <div class="container">
            <h2>Connect With Us</h2>
          <p><strong>Contact us to learn more about Great Rocks</strong></p>
        </div>
    </header>

    <main class="container">
        <div class="section-card">
            <h3>Inquiry Form</h3>
            <p>Fill out the parameters below. <span class="highlight-text">Response times typically range under 24 business hours</span>.</p>
            <br>
            <form action="#" method="post" onsubmit="event.preventDefault(); alert('Form submitted simulation!');">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Questions:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Submit Specifications</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Great Rocks.</p>
    </footer>

</body>
</html>
